name: ares-source-simulation
services:
  simulation:
    image: ares-source-simulation:classic-20261001-r1
    build:
      context: ${ARES_SIMULATION_ROOT}
      dockerfile: Dockerfile
      target: simulation
    init: true
    user: "${ARES_SIMULATION_UID}:${ARES_SIMULATION_GID}"
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ARES_DADOS: /app/resultados/fonte-simulada
    volumes:
      - ${ARES_SIMULATION_ROOT}/tools/source_simulation:/app/tools/source_simulation:ro
      - ${ARES_SIMULATION_ROOT}/resultados/fonte-simulada:/app/resultados/fonte-simulada
    entrypoint: [python, /app/tools/source_simulation/server.py]
    command: []
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); o.open('http://127.0.0.1:8000/', timeout=2); o.open('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 7s
      start_period: 10s
