name: ares-radiacode-ceia-test

x-app: &app
  build:
    context: ${ARES_CEIA_ROOT:?Defina ARES_CEIA_ROOT ou use ./ensaio}
    dockerfile: Dockerfile.radiacode-ceia
  image: ares-radiacode-ceia:20260930-r1
  init: true
  network_mode: host
  user: "${ARES_DOCKER_UID:-1000}:${ARES_DOCKER_GID:-1000}"
  stop_grace_period: 30s

x-env: &env
  ARES_HOST: 127.0.0.1
  ARES_PORTA: "8001"
  ARES_DADOS: /app/dados
  ARES_FONTE_RADIACAO: radiacode
  ARES_RADIACODE_URL: ws://127.0.0.1:1098/ws
  ARES_LATENCIA_LEITURA_S: "${ARES_LATENCIA_LEITURA_S:-0.5}"
  ARES_OFFSET_DETECTOR: "${ARES_OFFSET_DETECTOR:-0,0}"
  ARES_RADIACODE_CPS_POR_USVH: "${ARES_RADIACODE_CPS_POR_USVH:-}"

services:
  usb:
    build:
      context: ${ARES_DETECTOR_ROOT:?Use ./ensaio}
      dockerfile: tools/radiacode_usb/Dockerfile.service
    image: ares-radiacode-service:20260930-r1
    init: true
    network_mode: host
    user: "${ARES_DOCKER_UID:-1000}:${ARES_DOCKER_GID:-1000}"
    stop_grace_period: 20s
    environment:
      ARES_RADIACODE_LOCK_DIR: /app/usb-lock
    volumes:
      - ${ARES_DETECTOR_ROOT}/resultados/ceia/usb:/app/resultados
      - ${ARES_USB_LOCK_DIR}:/app/usb-lock
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules: ['c 189:* rwm']
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1098/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  ares-usb-simulado:
    <<: *app
    profiles: [simulado]
    environment:
      <<: *env
      ARES_MODO: simulacao
    volumes:
      - ${ARES_DETECTOR_ROOT}/resultados/ceia/simulacao:/app/dados

  ares-usb-real:
    <<: *app
    profiles: [real]
    environment:
      <<: *env
      ARES_MODO: real
      GO2_AES_KEY: "${GO2_AES_KEY:-}"
    volumes:
      - ${ARES_DETECTOR_ROOT}/resultados/ceia/real:/app/dados
