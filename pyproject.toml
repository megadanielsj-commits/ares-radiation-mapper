[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ares"
version = "0.1.0"
description = "ARES — mapeamento de radiação combinando pose do Go2 e leituras do FS-5000"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
    "websockets>=12",
]

[project.scripts]
ares = "ares.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
