[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ares-radiation-mapper"
version = "0.4.10"
description = "ARES simple radiological gradient mapper"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Projeto ARES" },
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
fs5000 = ["pyserial>=3.5,<4"]
radiacode-usb = ["radiacode==0.4.0"]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.110,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ares-map = "ares_mapper.cli:app"

[tool.hatch.build]
exclude = [
  "/.hypothesis",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/artifacts",
  "/data/missions",
  "/demo",
  "/dist",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ares_mapper"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/ares_mapper/adapters/fs5000/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^src/ares_mapper/adapters/fs5000/vendor/"]

# Preserve the external FS-5000 implementation; check all ARES-owned modules.
# exclude skips discovery only, so this override also handles followed imports.
[[tool.mypy.overrides]]
module = "ares_mapper.adapters.fs5000.vendor.*"
ignore_errors = true
