name: ares-radiation-mapper

services:
  simulation:
    profiles: [simulation]
    build:
      context: .
      target: simulation
    image: ares-radiation-mapper:simulation
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./data/missions:/app/data/missions
    command: ["--mode", "simulation", "--host", "0.0.0.0", "--no-open-browser"]

  hardware:
    profiles: [hardware]
    build:
      context: .
      target: hardware
      args:
        UNITREE_SDK2_COMMIT: 65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5
    image: ares-radiation-mapper:hardware
    init: true
    network_mode: host
    devices:
      - "${FS5000_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    environment:
      ARES_MODE: hardware
      ARES_NETWORK_INTERFACE: "${ARES_NETWORK_INTERFACE:-}"
      ARES_SERIAL_PORT: /dev/ttyUSB0
    volumes:
      - ./data/missions:/app/data/missions
    command: ["--mode", "hardware", "--host", "0.0.0.0", "--no-open-browser"]

  fonte-simulada:
    profiles: [fonte-simulada]
    build:
      context: .
      target: simulation
    image: ares-radiation-mapper:simulation
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/missions:/app/data/missions
    entrypoint: ["ares-map", "run"]
    command: ["--scenario", "config/scenarios/static_source.yaml", "--host", "0.0.0.0", "--port", "8000", "--no-open-browser"]

  radiacode-usb:
    profiles: [radiacode-usb]
    build:
      context: .
      target: radiacode
    image: ares-radiation-mapper:radiacode
    init: true
    environment:
      ARES_RADIACODE_LOCK_DIR: /app/usb-lock
    healthcheck:
      disable: true
    volumes:
      - ./resultados:/app/resultados
      - /dev/bus/usb:/dev/bus/usb
      - ${ARES_USB_LOCK_DIR:-/tmp/ares-radiacode-lock-1000}:/app/usb-lock
    device_cgroup_rules:
      - 'c 189:* rwm'
    user: "${ARES_DOCKER_UID:-1000}:${ARES_DOCKER_GID:-1000}"
    entrypoint: ["bash", "/app/tools/radiacode_usb/docker-entrypoint.sh", "record"]
    command: ["--seconds", "60"]

  radiacode-dashboard:
    environment:
      ARES_RADIACODE_LOCK_DIR: /app/usb-lock
    profiles: [radiacode-dashboard]
    build:
      context: .
      target: radiacode
    image: ares-radiation-mapper:radiacode
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./resultados:/app/resultados
      - /dev/bus/usb:/dev/bus/usb
      - ${ARES_USB_LOCK_DIR:-/tmp/ares-radiacode-lock-1000}:/app/usb-lock
    device_cgroup_rules:
      - 'c 189:* rwm'
    user: "${ARES_DOCKER_UID:-1000}:${ARES_DOCKER_GID:-1000}"
    entrypoint: ["bash", "/app/tools/radiacode_usb/docker-entrypoint.sh", "dashboard"]
    command: []
