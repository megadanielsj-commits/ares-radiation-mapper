name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,fs5000,radiacode-usb]"
      - name: Tests
        timeout-minutes: 5
        run: python -m pytest --junitxml=pytest-results.xml -o faulthandler_timeout=60 --ignore=tests/compatibility/test_classic_map.py
      - name: Publish exact pytest errors as check annotations
        if: always()
        run: python tools/report_ci.py pytest-results.xml
      - name: Install Go2 reference test dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r vendor/go2_runtime/requirements-go2-wifi.txt
          python -m pip install --no-deps unitree_webrtc_connect==2.2.0
      - name: Go2 runtime compatibility regression
        if: matrix.python-version == '3.12'
        timeout-minutes: 5
        run: PYTHONPATH=vendor/go2_runtime/src python -m pytest -q vendor/go2_runtime/tests --junitxml=pytest-go2-results.xml -o faulthandler_timeout=60
      - name: Publish Go2 pytest errors as check annotations
        if: always() && matrix.python-version == '3.12'
        run: python tools/report_ci.py pytest-go2-results.xml
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '22'
      - name: USB dashboard regression
        if: matrix.python-version == '3.12'
        run: node --test tests/radiacode/dashboard_usb.test.cjs
      - name: Operator console and approved map regression
        if: matrix.python-version == '3.12'
        timeout-minutes: 5
        run: |
          PYTHONPATH=src:vendor/go2_runtime/src python -m pytest -q tools/operator_console/test_console.py tools/operator_console/test_stationary_map.py tests/compatibility/test_classic_map.py --junitxml=pytest-console-results.xml -o faulthandler_timeout=60
          python -m tools.operator_console.check_map_lock
      - name: Publish console pytest errors as check annotations
        if: always() && matrix.python-version == '3.12'
        run: python tools/report_ci.py pytest-console-results.xml
      - name: Console rendering contracts
        if: matrix.python-version == '3.12'
        run: node --test tools/operator_console/console.test.cjs
      - name: Go2 reference dashboard contracts
        if: matrix.python-version == '3.12'
        run: node --test vendor/go2_runtime/tests/approved_dashboard.test.cjs
      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check src tests
      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Build and smoke-test unified console
        if: matrix.python-version == '3.12'
        run: |
          ARES_CONSOLE_ROOT="$PWD" ARES_CONSOLE_UID="$(id -u)" ARES_CONSOLE_GID="$(id -g)" ARES_USB_LOCK_DIR=/tmp/ares-ci-usb-lock docker compose -f tools/operator_console/compose.yaml config --quiet
          docker build -f tools/operator_console/Dockerfile -t ares-operator-console:ci .
          docker run --detach --name ares-console-ci --network host ares-operator-console:ci
          trap 'docker rm --force ares-console-ci' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8001/api/console/state && break
            sleep 1
          done
          curl --fail --silent --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:8001/api/console/start
          sleep 3
          curl --fail --silent --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:8001/api/console/stop
          curl --fail --silent http://127.0.0.1:8001/api/console/export --output /tmp/ares-console-mission.zip
      - name: Build independent Radiacode USB service
        if: matrix.python-version == '3.12'
        run: |
          docker build -f tools/radiacode_usb/Dockerfile.service -t ares-radiacode-service:ci .
          docker run --rm --entrypoint python ares-radiacode-service:ci \
            -c 'import radiacode, fastapi; print("Standalone USB bridge dependencies ready")'
