name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,fs5000,radiacode-usb]"
      - name: Tests
        run: python -m pytest --junitxml=pytest-results.xml
      - name: Publish exact pytest errors as check annotations
        if: always()
        run: python tools/report_ci.py pytest-results.xml
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '22'
      - name: USB dashboard regression
        if: matrix.python-version == '3.12'
        run: node --test tests/radiacode/dashboard_usb.test.cjs
      - name: Operator console and approved map regression
        run: |
          PYTHONPATH=src:vendor/go2_runtime/src python -m pytest -q tools/operator_console/test_console.py tools/operator_console/test_stationary_map.py tools/source_simulation/test_demo.py
          python -m tools.operator_console.check_map_lock
      - name: Console rendering contracts
        if: matrix.python-version == '3.12'
        run: node --test tools/operator_console/console.test.cjs
      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check src tests
      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Build simulation image
        if: matrix.python-version == '3.12'
        run: docker build --target simulation -t ares-radiation-mapper:ci .
      - name: Smoke-test simulation image
        if: matrix.python-version == '3.12'
        run: |
          docker run --detach --name ares-ci --publish 8000:8000 ares-radiation-mapper:ci
          trap 'docker rm --force ares-ci' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"x_m":7.5,"y_m":5.5,"dose_rate_at_1m_uSv_h":10000}' \
            http://127.0.0.1:8000/api/v1/simulation/start
          sleep 2
          test "$(curl --fail --silent http://127.0.0.1:8000/api/v1/status \
            | python -c 'import json,sys; print(json.load(sys.stdin)["state"])')" = RUNNING
      - name: Build hardware image
        if: matrix.python-version == '3.12'
        run: docker build --target hardware -t ares-radiation-mapper:hardware-ci .
      - name: Build and smoke-test unified console
        if: matrix.python-version == '3.12'
        run: |
          docker build -f tools/operator_console/Dockerfile -t ares-operator-console:ci .
          docker run --detach --name ares-console-ci --network host ares-operator-console:ci
          trap 'docker rm --force ares-console-ci' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8001/api/console/state && break
            sleep 1
          done
          curl --fail --silent --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:8001/api/console/start
          sleep 3
          curl --fail --silent --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:8001/api/console/stop
          curl --fail --silent http://127.0.0.1:8001/api/console/export --output /tmp/ares-console-mission.zip
      - name: Build Radiacode USB image and validate Compose
        if: matrix.python-version == '3.12'
        run: |
          docker build --target radiacode -t ares-radiation-mapper:radiacode-ci .
          docker run --rm --entrypoint python ares-radiation-mapper:radiacode-ci \
            -c 'import radiacode, ares_mapper; print("Radiacode USB image ready")'
          docker compose --profile radiacode-dashboard config --quiet
          docker build -f tools/radiacode_usb/Dockerfile.service -t ares-radiacode-service:ci .
          docker run --rm --entrypoint python ares-radiacode-service:ci \
            -c 'import radiacode, fastapi; print("Standalone USB bridge dependencies ready")'
