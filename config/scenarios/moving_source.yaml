schema_version: "1.1"
mission: {name: fonte-movel, mode: sim, seed: 20260729, duration_s: 120, simulation_speed: 5.0}
world:
  frame_id: world
  bounds_m: {x_min: 0.0, x_max: 10.0, y_min: 0.0, y_max: 8.0}
  map_resolution_m: 0.10
  background: {model: constant, dose_rate_uSv_h: 0.10}
trajectory:
  type: lawnmower
  speed_m_s: 0.45
  line_spacing_m: 0.8
  rectangle_m: {x_min: 0.8, x_max: 9.2, y_min: 0.8, y_max: 7.2}
  loop: true
odometry: {publish_rate_hz: 20.0, position_noise_std_m: 0.015, yaw_noise_std_rad: 0.006}
radiation_sources:
  - id: source_moving
    model: inverse_square
    position_keyframes:
      - {time_s: 0, x_m: 7.5, y_m: 5.5, z_m: 0.8}
      - {time_s: 60, x_m: 7.5, y_m: 5.5, z_m: 0.8}
      - {time_s: 65, x_m: 3.0, y_m: 2.5, z_m: 0.8}
    strength_keyframes:
      - {time_s: 0, dose_rate_at_reference_uSv_h: 3.0}
detectors:
  - sensor_id: simulated_fs5000
    publish_rate_hz: 1.0
    transform_base_sensor: {translation_m: [0.0, 0.0, 0.25], rpy_rad: [0.0, 0.0, 0.0]}
synchronization: {max_pose_gap_ms: 500, allow_nearest_fallback: true}
mapping:
  temporal_mode: sliding_window
  sliding_window_s: 30
  grid_resolution_m: 0.10
  influence_radius_m: 1.0
dashboard: {scale_mode: fixed, scale_min_uSv_h: 0.0, scale_max_uSv_h: 3.5}
