schema_version: "1.1"
mission:
  name: replay-real-fs5000
  mode: sim
  seed: 20260803
  duration_s: 20
  simulation_speed: 5.0
world:
  bounds_m: {x_min: 0.0, x_max: 10.0, y_min: 0.0, y_max: 8.0}
  background: {model: constant, dose_rate_uSv_h: 0.10}
trajectory:
  type: circle
  circle_center_m: [5.0, 4.0, 0.32]
  circle_radius_m: 2.5
  speed_m_s: 0.5
  loop: true
odometry:
  publish_rate_hz: 20.0
  position_noise_std_m: 0.01
radiation_sources: []
detectors:
  - sensor_id: fs5000_csv_replay
    source_type: csv_replay
    replay_csv_path: tests/fixtures/fs5000_sample.csv
    publish_rate_hz: 1.0
    transform_base_sensor:
      translation_m: [0.0, 0.0, 0.25]
      rpy_rad: [0.0, 0.0, 0.0]
synchronization:
  max_pose_gap_ms: 500
  allow_nearest_fallback: true
  nearest_fallback_max_ms: 250
mapping:
  temporal_mode: cumulative
  grid_resolution_m: 0.10
  influence_radius_m: 1.0
dashboard:
  scale_mode: fixed
  scale_min_uSv_h: 0.0
  scale_max_uSv_h: 0.30
  show_truth_field: false
  show_truth_sources: false
